name: transactions
version: '1.0.0'
config-version: 2
profile: transactions

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
clean-targets: [target, dbt_packages]

dispatch:
  - macro_namespace: dbt_date
    search_order: [transactions, dbt_date]

models:
  transactions:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +engine: MergeTree()
