transactions:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'student') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'homework') }}"
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'transactions_dbt') }}"
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'false') | lower == 'true' }}"
      threads: 4
